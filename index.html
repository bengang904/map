<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>中国道路导航</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:Arial,"Microsoft YaHei",sans-serif;
}

#map{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#panel{
    position:absolute;
    z-index:1000;
    top:15px;
    left:15px;
    width:350px;
    background:#fff;
    box-shadow:0 3px 18px rgba(0,0,0,.28);
}

#status{
    padding:15px;
}

.title{
    margin-bottom:8px;
    font-size:18px;
    font-weight:bold;
}

.description{
    color:#666;
    font-size:13px;
    line-height:1.6;
}

.point-status{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
    font-size:13px;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#aaa;
}

.status-dot.start{
    background:#16803c;
}

.status-dot.end{
    background:#d52b1e;
}

.buttons{
    display:flex;
    border-top:1px solid #ddd;
}

.action-button{
    flex:1;
    height:42px;
    border:0;
    border-right:1px solid #ddd;
    background:#fff;
    cursor:pointer;
    font-size:13px;
}

.action-button:last-child{
    border-right:0;
}

.action-button:active{
    background:#eee;
}

#result{
    border-top:1px solid #ddd;
    padding:12px 15px;
    font-size:13px;
    line-height:1.7;
}

.route-title{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
    font-size:17px;
    font-weight:bold;
}

.route-icon{
    width:23px;
    height:23px;
}

.route-info{
    color:#444;
}

#steps{
    max-height:calc(100vh - 500px);
    overflow:auto;
    border-top:1px solid #ddd;
}

.step{
    display:flex;
    gap:10px;
    padding:11px 15px;
    border-bottom:1px solid #eee;
}

.step-icon{
    width:24px;
    height:24px;
    flex:none;
}

.step-icon svg{
    width:24px;
    height:24px;
}

.step-content{
    min-width:0;
    flex:1;
}

.step-name{
    font-size:13px;
    font-weight:bold;
    line-height:1.5;
}

.step-distance{
    margin-top:3px;
    color:#777;
    font-size:12px;
}

.marker-icon{
    background:transparent;
    border:0;
}

.marker-icon svg{
    display:block;
    width:40px;
    height:50px;
}

.map-controls{
    position:absolute;
    z-index:900;
    top:15px;
    right:15px;
    display:flex;
    flex-direction:column;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
}

.map-control{
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    padding:0;
    border:0;
    border-bottom:1px solid #ddd;
    background:#fff;
    cursor:pointer;
}

.map-control:last-child{
    border-bottom:0;
}

.map-control:active{
    background:#eee;
}

.map-control svg{
    width:21px;
    height:21px;
}

.mobile-route-bar{
    display:none;
}

@media(max-width:700px){

    #panel{
        top:0;
        left:0;
        width:100%;
        background:transparent;
        box-shadow:none;
        pointer-events:none;
    }

    #status{
        margin:10px;
        padding:12px;
        background:#fff;
        box-shadow:0 2px 14px rgba(0,0,0,.25);
        pointer-events:auto;
    }

    .title{
        font-size:16px;
    }

    .description{
        font-size:12px;
    }

    .point-status{
        margin-top:9px;
    }

    .buttons{
        margin-top:10px;
    }

    .action-button{
        height:39px;
    }

    #result{
        position:fixed;
        right:0;
        bottom:0;
        left:0;
        z-index:1100;
        min-height:90px;
        padding:12px 65px 12px 15px;
        padding-bottom:calc(12px + env(safe-area-inset-bottom));
        background:#fff;
        box-shadow:0 -2px 14px rgba(0,0,0,.22);
        pointer-events:auto;
    }

    #steps{
        position:fixed;
        right:0;
        bottom:0;
        left:0;
        z-index:1050;
        max-height:65vh;
        padding-bottom:100px;
        background:#fff;
        box-shadow:0 -3px 18px rgba(0,0,0,.25);
        transform:translateY(calc(100% - 90px));
        transition:transform .25s ease;
        pointer-events:auto;
    }

    #steps.open{
        transform:translateY(0);
    }

    .mobile-route-bar{
        position:fixed;
        right:0;
        bottom:0;
        left:0;
        z-index:1060;
        display:block;
        height:90px;
        background:#fff;
        pointer-events:none;
    }

    .mobile-route-handle{
        position:absolute;
        top:7px;
        left:50%;
        width:40px;
        height:4px;
        transform:translateX(-50%);
        background:#aaa;
    }

    #stepToggle{
        position:absolute;
        top:24px;
        right:14px;
        display:flex;
        align-items:center;
        justify-content:center;
        width:44px;
        height:44px;
        padding:0;
        border:0;
        background:#1976d2;
        pointer-events:auto;
    }

    #stepToggle svg{
        width:22px;
        height:22px;
    }

    .map-controls{
        top:265px;
        right:10px;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="map-controls">

    <button class="map-control" id="zoomIn">
        <svg viewBox="0 0 24 24">
            <path
                d="M12 5v14M5 12h14"
                fill="none"
                stroke="#222"
                stroke-width="2"
                stroke-linecap="round"/>
        </svg>
    </button>

    <button class="map-control" id="zoomOut">
        <svg viewBox="0 0 24 24">
            <path
                d="M5 12h14"
                fill="none"
                stroke="#222"
                stroke-width="2"
                stroke-linecap="round"/>
        </svg>
    </button>

    <button class="map-control" id="fitRoute">
        <svg viewBox="0 0 24 24">
            <path
                d="M4 4h6M4 4v6M20 4h-6M20 4v6M4 20h6M4 20v-6M20 20h-6M20 20v-6"
                fill="none"
                stroke="#222"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
    </button>

</div>

<div id="panel">

    <div id="status">

        <div class="title">
            点击地图设置导航
        </div>

        <div class="description" id="description">
            第一次点击地图设置起点，第二次点击地图设置目的地。
        </div>

        <div class="point-status">

            <span
                id="startDot"
                class="status-dot">
            </span>

            <span id="startText">
                起点：未选择
            </span>

        </div>

        <div class="point-status">

            <span
                id="endDot"
                class="status-dot">
            </span>

            <span id="endText">
                目的地：未选择
            </span>

        </div>

        <div class="buttons">

            <button
                class="action-button"
                id="resetButton">
                重新选择
            </button>

            <button
                class="action-button"
                id="routeButton">
                开始导航
            </button>

        </div>

    </div>

    <div id="result">
        等待选择起点和目的地
    </div>

    <div id="steps"></div>

    <div class="mobile-route-bar">

        <div class="mobile-route-handle"></div>

        <button id="stepToggle">

            <svg viewBox="0 0 24 24">
                <path
                    d="M6 9l6 6 6-6"
                    fill="none"
                    stroke="#fff"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
            </svg>

        </button>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        var map=L.map(
            "map",
            {
                crs:L.CRS.EPSG3395,
                center:[
                    39.9087,
                    116.3975
                ],
                zoom:13,
                zoomControl:false,
                attributionControl:false
            }
        );

        L.tileLayer(
            "https://core-renderer-tiles.maps.yandex.net/tiles?l=map&x={x}&y={y}&z={z}&scale=1&lang=zh_CN",
            {
                tileSize:256,
                maxZoom:19,
                noWrap:true
            }
        ).addTo(map);

        var startPoint=null;
        var endPoint=null;

        var startMarker=null;
        var endMarker=null;

        var routeLayer=null;

        var snappedStart=null;
        var snappedEnd=null;

        var selecting=true;

        function createMarkerIcon(
            type
        ){

            var color=
                type==="start"
                ?
                "#16803c"
                :
                "#d52b1e";

            return L.divIcon({
                className:
                    "marker-icon",

                html:
                    '<svg viewBox="0 0 40 50">'+
                    '<path d="M20 1C9.5 1 2 8.5 2 18c0 12.5 18 31 18 31s18-18.5 18-31C38 8.5 30.5 1 20 1z" fill="'+
                    color+
                    '"/>'+
                    '<circle cx="20" cy="18" r="9" fill="#fff"/>'+
                    '<circle cx="20" cy="18" r="4" fill="'+
                    color+
                    '"/>'+
                    '</svg>',

                iconSize:[
                    40,
                    50
                ],

                iconAnchor:[
                    20,
                    49
                ]
            });
        }

        function updateStatus(){

            var startText=
                document.getElementById(
                    "startText"
                );

            var endText=
                document.getElementById(
                    "endText"
                );

            var startDot=
                document.getElementById(
                    "startDot"
                );

            var endDot=
                document.getElementById(
                    "endDot"
                );

            if(startPoint){

                startText.textContent=
                    "起点："+
                    startPoint[1]
                        .toFixed(6)+
                    ","+
                    startPoint[0]
                        .toFixed(6);

                startDot.className=
                    "status-dot start";
            }
            else{

                startText.textContent=
                    "起点：未选择";

                startDot.className=
                    "status-dot";
            }

            if(endPoint){

                endText.textContent=
                    "目的地："+
                    endPoint[1]
                        .toFixed(6)+
                    ","+
                    endPoint[0]
                        .toFixed(6);

                endDot.className=
                    "status-dot end";
            }
            else{

                endText.textContent=
                    "目的地：未选择";

                endDot.className=
                    "status-dot";
            }
        }

        function resetSelection(){

            startPoint=null;
            endPoint=null;

            snappedStart=null;
            snappedEnd=null;

            selecting=true;

            if(startMarker){

                map.removeLayer(
                    startMarker
                );

                startMarker=null;
            }

            if(endMarker){

                map.removeLayer(
                    endMarker
                );

                endMarker=null;
            }

            if(routeLayer){

                map.removeLayer(
                    routeLayer
                );

                routeLayer=null;
            }

            document.getElementById(
                "description"
            ).textContent=
                "第一次点击地图设置起点，第二次点击地图设置目的地。";

            document.getElementById(
                "result"
            ).textContent=
                "等待选择起点和目的地";

            document.getElementById(
                "steps"
            ).innerHTML="";

            updateStatus();
        }

        function selectPoint(
            latlng
        ){

            if(!selecting){
                return;
            }

            var point=[
                latlng.lat,
                latlng.lng
            ];

            if(!startPoint){

                startPoint=point;

                startMarker=
                    L.marker(
                        point,
                        {
                            icon:
                                createMarkerIcon(
                                    "start"
                                )
                        }
                    ).addTo(map);

                startMarker.bindPopup(
                    "起点"
                );

                document.getElementById(
                    "description"
                ).textContent=
                    "起点已经选择，请点击地图选择目的地。";

                updateStatus();

                return;
            }

            if(!endPoint){

                endPoint=point;

                endMarker=
                    L.marker(
                        point,
                        {
                            icon:
                                createMarkerIcon(
                                    "end"
                                )
                        }
                    ).addTo(map);

                endMarker.bindPopup(
                    "目的地"
                );

                selecting=false;

                document.getElementById(
                    "description"
                ).textContent=
                    "起点和目的地已经选择，正在寻找最近道路。";

                updateStatus();

                snapAndRoute();
            }
        }

        function nearestRoad(
            point
        ){

            var url=
                "https://router.project-osrm.org/nearest/v1/driving/"+
                point[1]+
                ","+
                point[0]+
                "?number=1";

            return fetch(url)
                .then(
                    function(response){

                        if(!response.ok){

                            throw new Error(
                                "最近道路查询 HTTP "+
                                response.status
                            );
                        }

                        return response.json();
                    }
                )
                .then(
                    function(data){

                        if(
                            data.code!=="Ok" ||
                            !data.waypoints ||
                            !data.waypoints.length
                        ){

                            throw new Error(
                                "附近没有可导航道路"
                            );
                        }

                        var waypoint=
                            data.waypoints[0];

                        return {
                            point:[
                                waypoint.location[1],
                                waypoint.location[0]
                            ],
                            distance:
                                waypoint.distance
                        };
                    }
                );
        }

        function snapAndRoute(){

            document.getElementById(
                "result"
            ).innerHTML=
                "正在寻找起点和目的地附近的道路...";

            Promise.all([
                nearestRoad(startPoint),
                nearestRoad(endPoint)
            ])
            .then(
                function(result){

                    snappedStart=
                        result[0];

                    snappedEnd=
                        result[1];

                    if(startMarker){

                        startMarker.setLatLng(
                            snappedStart.point
                        );
                    }

                    if(endMarker){

                        endMarker.setLatLng(
                            snappedEnd.point
                        );
                    }

                    document.getElementById(
                        "description"
                    ).textContent=
                        "已经吸附到最近道路，正在计算实际道路路线。";

                    requestRoute();
                }
            )
            .catch(
                function(error){

                    console.error(
                        error
                    );

                    document.getElementById(
                        "result"
                    ).innerHTML=
                        "寻找道路失败：<br>"+
                        error.message;

                    selecting=true;
                }
            );
        }

        function requestRoute(){

            var start=
                snappedStart.point;

            var end=
                snappedEnd.point;

            var coordinates=
                start[1]+
                ","+
                start[0]+
                ";"+
                end[1]+
                ","+
                end[0];

            var url=
                "https://router.project-osrm.org/route/v1/driving/"+
                coordinates+
                "?overview=full"+
                "&geometries=geojson"+
                "&steps=true"+
                "&alternatives=true";

            document.getElementById(
                "result"
            ).innerHTML=
                "正在计算道路导航路线...";

            fetch(url)
            .then(
                function(response){

                    if(!response.ok){

                        throw new Error(
                            "路线服务器 HTTP "+
                            response.status
                        );
                    }

                    return response.json();
                }
            )
            .then(
                function(data){

                    if(
                        data.code!=="Ok" ||
                        !data.routes ||
                        !data.routes.length
                    ){

                        throw new Error(
                            "两个道路点之间没有可用路线"
                        );
                    }

                    drawRoute(
                        data.routes[0]
                    );
                }
            )
            .catch(
                function(error){

                    console.error(
                        error
                    );

                    document.getElementById(
                        "result"
                    ).innerHTML=
                        "道路导航失败：<br>"+
                        error.message;

                    selecting=true;
                }
            );
        }

        function drawRoute(
            route
        ){

            if(routeLayer){

                map.removeLayer(
                    routeLayer
                );
            }

            routeLayer=
                L.geoJSON(
                    route.geometry,
                    {
                        style:{
                            color:"#1976d2",
                            weight:7,
                            opacity:.92
                        }
                    }
                ).addTo(map);

            fitRoute();

            var distance=
                route.distance/1000;

            var minutes=
                Math.round(
                    route.duration/60
                );

            var hours=
                Math.floor(
                    minutes/60
                );

            var remain=
                minutes%60;

            var timeText;

            if(hours){

                timeText=
                    hours+
                    " 小时 "+
                    remain+
                    " 分钟";

            }
            else{

                timeText=
                    minutes+
                    " 分钟";
            }

            var startSnapDistance=
                snappedStart.distance;

            var endSnapDistance=
                snappedEnd.distance;

            document.getElementById(
                "result"
            ).innerHTML=

                '<div class="route-title">'+

                '<svg class="route-icon" viewBox="0 0 24 24">'+
                '<path d="M5 17h14M7 17V9l2-3h6l2 3v8M8 9h8" fill="none" stroke="#1976d2" stroke-width="2"/>'+
                '<circle cx="8" cy="18" r="2" fill="#1976d2"/>'+
                '<circle cx="16" cy="18" r="2" fill="#1976d2"/>'+
                '</svg>'+

                '道路导航'+

                '</div>'+

                '<div class="route-info">'+

                '起点吸附：'+
                formatDistance(
                    startSnapDistance
                )+
                '<br>'+

                '目的地吸附：'+
                formatDistance(
                    endSnapDistance
                )+
                '<br>'+

                '道路距离：'+
                distance.toFixed(2)+
                ' km<br>'+

                '预计时间：'+
                timeText+

                '</div>';

            showSteps(
                route
            );
        }

        function fitRoute(){

            if(!routeLayer){
                return;
            }

            var bounds=
                routeLayer.getBounds();

            if(!bounds.isValid()){
                return;
            }

            if(window.innerWidth<=700){

                map.fitBounds(
                    bounds,
                    {
                        paddingTopLeft:[
                            25,
                            280
                        ],
                        paddingBottomRight:[
                            25,
                            160
                        ]
                    }
                );

            }
            else{

                map.fitBounds(
                    bounds,
                    {
                        paddingTopLeft:[
                            380,
                            25
                        ],
                        paddingBottomRight:[
                            25,
                            25
                        ]
                    }
                );
            }
        }

        function showSteps(
            route
        ){

            var container=
                document.getElementById(
                    "steps"
                );

            container.innerHTML="";

            var number=1;

            route.legs.forEach(
                function(leg){

                    leg.steps.forEach(
                        function(step){

                            var maneuver=
                                step.maneuver||{};

                            var div=
                                document.createElement(
                                    "div"
                                );

                            div.className=
                                "step";

                            div.innerHTML=

                                '<div class="step-icon">'+
                                getStepIcon(
                                    maneuver.type,
                                    maneuver.modifier
                                )+
                                '</div>'+

                                '<div class="step-content">'+

                                '<div class="step-name">'+
                                number+
                                ". "+
                                getInstruction(
                                    maneuver,
                                    step.name
                                )+
                                '</div>'+

                                '<div class="step-distance">'+
                                formatDistance(
                                    step.distance||0
                                )+
                                '</div>'+

                                '</div>';

                            container.appendChild(
                                div
                            );

                            number++;
                        }
                    );
                }
            );
        }

        function getInstruction(
            maneuver,
            road
        ){

            var type=
                maneuver.type||"";

            var modifier=
                maneuver.modifier||"";

            road=
                road||
                "当前道路";

            if(type==="depart"){
                return "从道路起点出发，进入 "+road;
            }

            if(type==="arrive"){
                return "到达目的地";
            }

            if(type==="turn"){

                if(modifier==="left"){
                    return "左转进入 "+road;
                }

                if(modifier==="right"){
                    return "右转进入 "+road;
                }

                if(modifier==="slight left"){
                    return "向左前方行驶进入 "+road;
                }

                if(modifier==="slight right"){
                    return "向右前方行驶进入 "+road;
                }

                return "转入 "+road;
            }

            if(type==="merge"){
                return "并入 "+road;
            }

            if(type==="on ramp"){
                return "驶入 "+road+" 匝道";
            }

            if(type==="off ramp"){
                return "驶出 "+road+" 匝道";
            }

            if(
                type==="roundabout"||
                type==="rotary"
            ){

                if(maneuver.exit){

                    return "进入环岛，在第 "+
                        maneuver.exit+
                        " 个出口驶出";
                }

                return "进入环岛";
            }

            return "继续沿 "+road+" 行驶";
        }

        function getStepIcon(
            type,
            modifier
        ){

            var d;

            if(type==="depart"){

                d=
                    "M12 20V4m0 0-6 6m6-6 6 6";
            }
            else if(type==="arrive"){

                d=
                    "M12 4v16m0 0-6-6m6 6 6-6";
            }
            else if(modifier==="left"){

                d=
                    "M19 18H9a5 5 0 0 1-5-5V7m0 0 4 4M4 7l-4 4";
            }
            else if(modifier==="right"){

                d=
                    "M5 18h10a5 5 0 0 0 5-5V7m0 0-4 4m4-4 4 4";
            }
            else{

                d=
                    "M12 20V4m0 0-6 6m6-6 6 6";
            }

            return `
            <svg viewBox="0 0 24 24">
                <path
                    d="${d}"
                    fill="none"
                    stroke="#1976d2"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
            </svg>`;
        }

        function formatDistance(
            distance
        ){

            if(distance<1000){

                return Math.round(
                    distance
                )+
                " 米";
            }

            return (
                distance/1000
            ).toFixed(1)+
            " 公里";
        }

        map.on(
            "click",
            function(event){

                selectPoint(
                    event.latlng
                );
            }
        );

        document
            .getElementById(
                "resetButton"
            )
            .addEventListener(
                "click",
                resetSelection
            );

        document
            .getElementById(
                "routeButton"
            )
            .addEventListener(
                "click",
                function(){

                    if(
                        startPoint &&
                        endPoint
                    ){

                        snapAndRoute();
                    }
                    else{

                        document.getElementById(
                            "result"
                        ).textContent=
                            "请先点击地图选择起点和目的地。";
                    }
                }
            );

        document
            .getElementById(
                "zoomIn"
            )
            .addEventListener(
                "click",
                function(){

                    map.zoomIn();
                }
            );

        document
            .getElementById(
                "zoomOut"
            )
            .addEventListener(
                "click",
                function(){

                    map.zoomOut();
                }
            );

        document
            .getElementById(
                "fitRoute"
            )
            .addEventListener(
                "click",
                fitRoute
            );

        document
            .getElementById(
                "stepToggle"
            )
            .addEventListener(
                "click",
                function(){

                    var steps=
                        document.getElementById(
                            "steps"
                        );

                    steps.classList.toggle(
                        "open"
                    );

                    var button=
                        document.getElementById(
                            "stepToggle"
                        );

                    if(
                        steps.classList.contains(
                            "open"
                        )
                    ){

                        button.innerHTML=
                            '<svg viewBox="0 0 24 24">'+
                            '<path d="M6 15l6-6 6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
                            '</svg>';

                    }
                    else{

                        button.innerHTML=
                            '<svg viewBox="0 0 24 24">'+
                            '<path d="M6 9l6 6 6-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
                            '</svg>';
                    }
                }
            );

        updateStatus();

    }
);
</script>

</body>
</html>
