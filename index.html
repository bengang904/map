<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>𓂸 Map 𓂸</title>
<script src="https://api-maps.yandex.ru/2.1/?lang=zh_CN" type="text/javascript"></script>
<style>
html,body,#map{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}
</style>
</head>
<body>

<div id="map"></div>

<script>
ymaps.ready(function () {
    var map = new ymaps.Map("map", {
        center: [55.751574, 37.573856],
        zoom: 12,
        controls: ["zoomControl", "fullscreenControl"]
    });

    var placemark = new ymaps.Placemark(
        [55.751574, 37.573856],
        {
            balloonContent: "莫斯科"
        },
        {
            preset: "islands#redDotIcon"
        }
    );

    map.geoObjects.add(placemark);
});
</script>

</body>
</html>
