<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>China-Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:Arial,"Microsoft YaHei",sans-serif;
}

#map{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#panel{
    position:absolute;
    z-index:1000;
    top:15px;
    left:15px;
    width:360px;
    max-height:calc(100vh - 30px);
    background:#fff;
    box-shadow:0 3px 18px rgba(0,0,0,.28);
}

#inputs{
    padding:15px;
    max-height:430px;
    overflow:auto;
}

.title{
    margin-bottom:13px;
    font-size:18px;
    font-weight:bold;
}

.point{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}

.point-icon{
    width:24px;
    height:24px;
    flex:none;
}

.point input{
    width:100%;
    height:40px;
    min-width:0;
    padding:0 10px;
    border:1px solid #ccc;
    outline:none;
    background:#fff;
    font-size:13px;
}

.point input:focus{
    border-color:#1976d2;
}

#routeButton{
    width:100%;
    height:44px;
    border:0;
    background:#1976d2;
    color:#fff;
    font-size:15px;
}

#routeButton:active{
    background:#125ca5;
}

#result{
    padding:12px 15px;
    border-top:1px solid #ddd;
    background:#fff;
}

.route-title{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
    font-size:17px;
    font-weight:bold;
}

.route-icon{
    width:23px;
    height:23px;
}

.route-info{
    color:#444;
    font-size:13px;
    line-height:1.7;
}

#steps{
    max-height:calc(100vh - 500px);
    overflow:auto;
    border-top:1px solid #ddd;
}

.step{
    display:flex;
    gap:10px;
    padding:11px 15px;
    border-bottom:1px solid #eee;
    background:#fff;
}

.step-icon{
    width:24px;
    height:24px;
    flex:none;
}

.step-icon svg{
    width:24px;
    height:24px;
}

.step-content{
    min-width:0;
    flex:1;
}

.step-name{
    font-size:13px;
    font-weight:bold;
    line-height:1.5;
}

.step-distance{
    margin-top:3px;
    color:#777;
    font-size:12px;
}

.map-controls{
    position:absolute;
    z-index:900;
    top:15px;
    right:15px;
    display:flex;
    flex-direction:column;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
}

.map-control{
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border:0;
    border-bottom:1px solid #ddd;
    background:#fff;
    cursor:pointer;
}

.map-control:last-child{
    border-bottom:0;
}

.map-control:active{
    background:#eee;
}

.map-control svg{
    width:21px;
    height:21px;
}

.mobile-route-bar{
    display:none;
}

@media(max-width:700px){

    #panel{
        top:0;
        left:0;
        width:100%;
        max-height:none;
        background:transparent;
        box-shadow:none;
        pointer-events:none;
    }

    #inputs{
        position:absolute;
        top:10px;
        left:10px;
        right:10px;
        max-height:250px;
        padding:12px;
        background:#fff;
        box-shadow:0 2px 14px rgba(0,0,0,.25);
        pointer-events:auto;
    }

    .title{
        margin-bottom:9px;
        font-size:16px;
    }

    .point{
        margin-bottom:6px;
    }

    .point-icon{
        width:22px;
        height:22px;
    }

    .point input{
        height:37px;
        font-size:13px;
    }

    #routeButton{
        height:41px;
    }

    #result{
        position:fixed;
        right:0;
        bottom:0;
        left:0;
        z-index:1100;
        min-height:92px;
        padding:12px 65px 12px 15px;
        padding-bottom:calc(12px + env(safe-area-inset-bottom));
        box-shadow:0 -2px 14px rgba(0,0,0,.22);
        pointer-events:auto;
    }

    #steps{
        position:fixed;
        right:0;
        bottom:0;
        left:0;
        z-index:1050;
        max-height:65vh;
        padding-top:30px;
        padding-bottom:100px;
        background:#fff;
        box-shadow:0 -3px 18px rgba(0,0,0,.25);
        transform:translateY(calc(100% - 92px));
        transition:transform .25s ease;
        pointer-events:auto;
    }

    #steps.open{
        transform:translateY(0);
    }

    .mobile-route-bar{
        position:fixed;
        right:0;
        bottom:0;
        left:0;
        z-index:1060;
        display:block;
        height:92px;
        background:#fff;
        pointer-events:none;
    }

    .mobile-route-handle{
        position:absolute;
        top:7px;
        left:50%;
        width:40px;
        height:4px;
        transform:translateX(-50%);
        background:#aaa;
    }

    #stepToggle{
        position:absolute;
        top:25px;
        right:14px;
        display:flex;
        align-items:center;
        justify-content:center;
        width:44px;
        height:44px;
        border:0;
        background:#1976d2;
        pointer-events:auto;
    }

    #stepToggle svg{
        width:22px;
        height:22px;
    }

    .map-controls{
        top:275px;
        right:10px;
    }

    .map-control{
        width:42px;
        height:42px;
    }
}

@media(max-width:700px) and (orientation:landscape){

    #inputs{
        width:390px;
        max-height:185px;
        right:auto;
    }

    #result{
        width:390px;
        right:auto;
    }

    #steps{
        max-height:75vh;
    }

    .mobile-route-bar{
        width:390px;
        right:auto;
    }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="map-controls">

    <button class="map-control" id="zoomIn" aria-label="放大">
        <svg viewBox="0 0 24 24">
            <path
                d="M12 5v14M5 12h14"
                fill="none"
                stroke="#222"
                stroke-width="2"
                stroke-linecap="round"/>
        </svg>
    </button>

    <button class="map-control" id="zoomOut" aria-label="缩小">
        <svg viewBox="0 0 24 24">
            <path
                d="M5 12h14"
                fill="none"
                stroke="#222"
                stroke-width="2"
                stroke-linecap="round"/>
        </svg>
    </button>

    <button class="map-control" id="locateRoute" aria-label="显示完整路线">
        <svg viewBox="0 0 24 24">
            <path
                d="M4 4h6M4 4v6M20 4h-6M20 4v6M4 20h6M4 20v-6M20 20h-6M20 20v-6"
                fill="none"
                stroke="#222"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
    </button>

</div>

<div id="panel">

    <div id="inputs">

        <div class="title">
            北京复杂道路导航
        </div>

        <div class="point">
            <svg class="point-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" fill="#16803c"/>
                <circle cx="12" cy="12" r="3" fill="#fff"/>
            </svg>
            <input id="p0" value="116.3975,39.9087">
        </div>

        <div class="point">
            <svg class="point-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" fill="#1976d2"/>
                <text x="12" y="16"
                    text-anchor="middle"
                    fill="#fff"
                    font-size="11"
                    font-weight="bold">1</text>
            </svg>
            <input id="p1" value="116.3967,39.9250">
        </div>

        <div class="point">
            <svg class="point-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" fill="#1976d2"/>
                <text x="12" y="16"
                    text-anchor="middle"
                    fill="#fff"
                    font-size="11"
                    font-weight="bold">2</text>
            </svg>
            <input id="p2" value="116.3907,39.9470">
        </div>

        <div class="point">
            <svg class="point-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" fill="#1976d2"/>
                <text x="12" y="16"
                    text-anchor="middle"
                    fill="#fff"
                    font-size="11"
                    font-weight="bold">3</text>
            </svg>
            <input id="p3" value="116.3910,39.9477">
        </div>

        <div class="point">
            <svg class="point-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" fill="#1976d2"/>
                <text x="12" y="16"
                    text-anchor="middle"
                    fill="#fff"
                    font-size="11"
                    font-weight="bold">4</text>
            </svg>
            <input id="p4" value="116.3965,39.9929">
        </div>

        <div class="point">
            <svg class="point-icon" viewBox="0 0 24 24">
                <path
                    d="M12 2C7.6 2 4 5.5 4 9.8c0 5.7 8 12.2 8 12.2s8-6.5 8-12.2C20 5.5 16.4 2 12 2z"
                    fill="#d52b1e"/>
                <circle cx="12" cy="10" r="3" fill="#fff"/>
            </svg>
            <input id="p5" value="116.3968,39.9924">
        </div>

        <button id="routeButton">
            开始道路导航
        </button>

    </div>

    <div id="result">
        正在准备道路导航
    </div>

    <div id="steps"></div>

    <div class="mobile-route-bar">

        <div class="mobile-route-handle"></div>

        <button id="stepToggle">

            <svg viewBox="0 0 24 24">
                <path
                    d="M6 9l6 6 6-6"
                    fill="none"
                    stroke="#fff"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
            </svg>

        </button>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

document.addEventListener("DOMContentLoaded",function(){

    var map=L.map("map",{
        center:[39.9087,116.3975],
        zoom:13,
        zoomControl:false
    });

    L.tileLayer(
        "https://core-renderer-tiles.maps.yandex.net/tiles?l=map&x={x}&y={y}&z={z}&scale=1&lang=zh_CN",
        {
            maxZoom:19,
            tileSize:256,
            attribution:""
        }
    ).addTo(map);

    var routePoints=[
        [39.9087,116.3975],
        [39.9250,116.3967],
        [39.9470,116.3907],
        [39.9477,116.3910],
        [39.9929,116.3965],
        [39.9924,116.3968]
    ];

    var markers=[];
    var routeLayer=null;

    function clearMarkers(){

        for(
            var i=0;
            i<markers.length;
            i++
        ){

            map.removeLayer(
                markers[i]
            );
        }

        markers=[];
    }

    function markerIcon(type,number){

        var color;

        if(type==="start"){
            color="#16803c";
        }
        else if(type==="end"){
            color="#d52b1e";
        }
        else{
            color="#1976d2";
        }

        var text="";

        if(type==="waypoint"){
            text=
                '<text x="19" y="21" text-anchor="middle" fill="#1976d2" font-size="10" font-weight="bold">'+
                number+
                '</text>';
        }

        return L.divIcon({
            className:"marker-icon",
            html:
                '<svg viewBox="0 0 38 48">'+
                '<path d="M19 1C9 1 2 8 2 17c0 12 17 30 17 30s17-18 17-30C36 8 29 1 19 1z" fill="'+
                color+
                '"/>'+
                '<circle cx="19" cy="17" r="8" fill="#fff"/>'+
                (
                    type==="waypoint"
                    ? text
                    : '<circle cx="19" cy="17" r="3" fill="'+color+'"/>'
                )+
                '</svg>',
            iconSize:[38,48],
            iconAnchor:[19,47]
        });
    }

    function updateMarkers(){

        clearMarkers();

        for(
            var i=0;
            i<routePoints.length;
            i++
        ){

            var type;

            if(i===0){
                type="start";
            }
            else if(
                i===routePoints.length-1
            ){
                type="end";
            }
            else{
                type="waypoint";
            }

            var marker=L.marker(
                routePoints[i],
                {
                    icon:markerIcon(
                        type,
                        i
                    )
                }
            ).addTo(map);

            marker.bindPopup(
                "坐标："+
                routePoints[i][1].toFixed(6)+
                ","+
                routePoints[i][0].toFixed(6)
            );

            markers.push(marker);
        }
    }

    function readPoints(){

        for(
            var i=0;
            i<routePoints.length;
            i++
        ){

            var input=
                document.getElementById(
                    "p"+i
                );

            if(!input){
                throw new Error(
                    "找不到坐标输入框 p"+i
                );
            }

            var value=
                input.value.trim();

            var parts=
                value.split(",");

            if(parts.length!==2){

                throw new Error(
                    "第 "+(i+1)+" 个坐标格式错误"
                );
            }

            var lon=
                Number(parts[0]);

            var lat=
                Number(parts[1]);

            if(
                !Number.isFinite(lon) ||
                !Number.isFinite(lat)
            ){

                throw new Error(
                    "第 "+(i+1)+" 个坐标不是有效数字"
                );
            }

            routePoints[i]=[
                lat,
                lon
            ];
        }
    }

    function buildRoute(){

        try{

            readPoints();

            updateMarkers();

            if(routeLayer){

                map.removeLayer(
                    routeLayer
                );

                routeLayer=null;
            }

            document.getElementById(
                "result"
            ).innerHTML=
                "正在计算道路路线...";

            document.getElementById(
                "steps"
            ).innerHTML="";

            var coordinateString="";

            for(
                var i=0;
                i<routePoints.length;
                i++
            ){

                if(i>0){
                    coordinateString+=";";
                }

                coordinateString+=
                    routePoints[i][1]+
                    ","+
                    routePoints[i][0];
            }

            var url=
                "https://router.project-osrm.org/route/v1/driving/"+
                coordinateString+
                "?overview=full"+
                "&geometries=geojson"+
                "&steps=true";

            fetch(url)

            .then(function(response){

                if(!response.ok){

                    throw new Error(
                        "路线服务器 HTTP "+
                        response.status
                    );
                }

                return response.json();
            })

            .then(function(data){

                if(
                    data.code!=="Ok" ||
                    !data.routes ||
                    !data.routes.length
                ){

                    throw new Error(
                        "没有找到道路路线"
                    );
                }

                var route=
                    data.routes[0];

                routeLayer=
                    L.geoJSON(
                        route.geometry,
                        {
                            style:{
                                color:"#1976d2",
                                weight:7,
                                opacity:.9
                            }
                        }
                    ).addTo(map);

                fitRoute();

                var km=
                    route.distance/1000;

                var totalMinutes=
                    Math.round(
                        route.duration/60
                    );

                var hours=
                    Math.floor(
                        totalMinutes/60
                    );

                var minutes=
                    totalMinutes%60;

                var time;

                if(hours>0){

                    time=
                        hours+
                        " 小时 "+
                        minutes+
                        " 分钟";

                }
                else{

                    time=
                        minutes+
                        " 分钟";
                }

                document.getElementById(
                    "result"
                ).innerHTML=

                    '<div class="route-title">'+
                    '<svg class="route-icon" viewBox="0 0 24 24">'+
                    '<path d="M5 17h14M7 17V9l2-3h6l2 3v8M8 9h8" fill="none" stroke="#1976d2" stroke-width="2"/>'+
                    '<circle cx="8" cy="18" r="2" fill="#1976d2"/>'+
                    '<circle cx="16" cy="18" r="2" fill="#1976d2"/>'+
                    '</svg>'+
                    '道路导航'+
                    '</div>'+
                    '<div class="route-info">'+
                    '途经点：'+
                    (routePoints.length-2)+
                    ' 个<br>'+
                    '总距离：'+
                    km.toFixed(2)+
                    ' km<br>'+
                    '预计时间：'+
                    time+
                    '</div>';

                showSteps(route);
            })

            .catch(function(error){

                console.error(
                    "ROUTE ERROR:",
                    error
                );

                document.getElementById(
                    "result"
                ).innerHTML=
                    "路线规划失败：<br>"+
                    error.message;
            });

        }
        catch(error){

            console.error(error);

            document.getElementById(
                "result"
            ).innerHTML=
                "输入错误：<br>"+
                error.message;
        }
    }

    function fitRoute(){

        if(!routeLayer){
            return;
        }

        var bounds=
            routeLayer.getBounds();

        if(!bounds.isValid()){
            return;
        }

        if(window.innerWidth<=700){

            map.fitBounds(
                bounds,
                {
                    paddingTopLeft:[30,290],
                    paddingBottomRight:[30,170]
                }
            );

        }
        else{

            map.fitBounds(
                bounds,
                {
                    paddingTopLeft:[390,30],
                    paddingBottomRight:[30,30]
                }
            );
        }
    }

    function showSteps(route){

        var container=
            document.getElementById(
                "steps"
            );

        container.innerHTML="";

        var number=1;

        route.legs.forEach(
            function(leg){

                leg.steps.forEach(
                    function(step){

                        var maneuver=
                            step.maneuver||{};

                        var instruction=
                            instructionText(
                                maneuver,
                                step.name
                            );

                        var div=
                            document.createElement(
                                "div"
                            );

                        div.className="step";

                        div.innerHTML=
                            '<div class="step-icon">'+
                            stepIcon(
                                maneuver.type,
                                maneuver.modifier
                            )+
                            '</div>'+
                            '<div class="step-content">'+
                            '<div class="step-name">'+
                            number+
                            ". "+
                            instruction+
                            '</div>'+
                            '<div class="step-distance">'+
                            formatDistance(
                                step.distance||0
                            )+
                            '</div>'+
                            '</div>';

                        container.appendChild(
                            div
                        );

                        number++;
                    }
                );
            }
        );
    }

    function instructionText(
        maneuver,
        road
    ){

        var type=
            maneuver.type||"";

        var modifier=
            maneuver.modifier||"";

        road=
            road||
            "当前道路";

        if(type==="depart"){
            return "从起点出发，进入 "+road;
        }

        if(type==="arrive"){
            return "到达目的地";
        }

        if(type==="turn"){

            if(modifier==="left"){
                return "左转进入 "+road;
            }

            if(modifier==="right"){
                return "右转进入 "+road;
            }

            if(modifier==="slight left"){
                return "向左前方行驶进入 "+road;
            }

            if(modifier==="slight right"){
                return "向右前方行驶进入 "+road;
            }

            return "转入 "+road;
        }

        if(type==="merge"){
            return "并入 "+road;
        }

        if(type==="on ramp"){
            return "驶入 "+road+" 匝道";
        }

        if(type==="off ramp"){
            return "驶出 "+road+" 匝道";
        }

        if(
            type==="roundabout"||
            type==="rotary"
        ){

            if(maneuver.exit){
                return "进入环岛，在第 "+
                    maneuver.exit+
                    " 个出口驶出";
            }

            return "进入环岛";
        }

        return "继续沿 "+road+" 行驶";
    }

    function stepIcon(
        type,
        modifier
    ){

        var d;

        if(type==="depart"){
            d="M12 20V4m0 0-6 6m6-6 6 6";
        }
        else if(
            type==="arrive"
        ){
            d="M12 4v16m0 0-6-6m6 6 6-6";
        }
        else if(
            modifier==="left"
        ){
            d="M19 18H9a5 5 0 0 1-5-5V7m0 0 4 4M4 7l-4 4";
        }
        else if(
            modifier==="right"
        ){
            d="M5 18h10a5 5 0 0 0 5-5V7m0 0-4 4m4-4 4 4";
        }
        else if(
            type==="roundabout"||
            type==="rotary"
        ){
            d="M18 8a7 7 0 1 0 1 7";
        }
        else{
            d="M12 20V4m0 0-6 6m6-6 6 6";
        }

        return `
        <svg viewBox="0 0 24 24">
            <path
                d="${d}"
                fill="none"
                stroke="#1976d2"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>`;
    }

    function formatDistance(distance){

        if(distance<1000){
            return Math.round(distance)+" 米";
        }

        return (
            distance/1000
        ).toFixed(1)+" 公里";
    }

    document
        .getElementById("routeButton")
        .addEventListener(
            "click",
            buildRoute
        );

    document
        .getElementById("zoomIn")
        .addEventListener(
            "click",
            function(){
                map.zoomIn();
            }
        );

    document
        .getElementById("zoomOut")
        .addEventListener(
            "click",
            function(){
                map.zoomOut();
            }
        );

    document
        .getElementById("locateRoute")
        .addEventListener(
            "click",
            function(){
                fitRoute();
            }
        );

    document
        .getElementById("stepToggle")
        .addEventListener(
            "click",
            function(){

                var steps=
                    document.getElementById(
                        "steps"
                    );

                steps.classList.toggle(
                    "open"
                );

                var button=
                    document.getElementById(
                        "stepToggle"
                    );

                if(
                    steps.classList.contains(
                        "open"
                    )
                ){

                    button.innerHTML=
                        '<svg viewBox="0 0 24 24">'+
